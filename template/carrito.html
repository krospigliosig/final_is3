<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InventarIO - Artículos Deportivos</title>
  <link rel="stylesheet" href="css/topbar.css">
  <link rel="stylesheet" href="css/tabla.css">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
   
    .btn-eliminar {
      background-color: #e74c3c;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 5px;
      cursor: pointer;
      font-family: 'Rajdhani', sans-serif;
      font-weight: bold;
      transition: all 0.3s;
    }

    .btn-eliminar:hover {
      background-color: #c0392b;
      transform: translateY(-2px);
      box-shadow: 0 3px 10px rgba(0,0,0,0.2);
    }
    
    .tabla-footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 20px;
    }

    .btn-reservar-tabla {
      background-color: #C061FF;
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'Rajdhani', sans-serif;
      font-weight: bold;
      font-size: 16px;
      transition: all 0.3s;
    }

    .btn-reservar-tabla:hover {
      background-color: #961de7;
      transform: translateY(-3px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>
  <div class="header-container">
    <header>
      <div class="nav-section">
        <div class="logo">inventarIO</div>
        <nav class="nav-categorias">
          <a href="#" class="filtro-categoria" data-categoria="Todos">Todos</a>
          <a href="#" class="filtro-categoria" data-categoria="Fútbol">Fútbol</a>
          <a href="#" class="filtro-categoria" data-categoria="Vóley">Vóley</a>
          <a href="#" class="filtro-categoria" data-categoria="Básquet">Básquet</a>
          <a href="#" class="filtro-categoria" data-categoria="Natación">Natación</a>
          
         
          <div class="dropdown-categoria">
            <a href="#" id="dropdownToggle">Más artículos ▾</a>
            <div class="dropdown-menu">
              <a href="#" class="filtro-categoria" data-categoria="Otros">Otros</a>
              <a href="#" class="filtro-categoria" data-categoria="Ejercicio">Ejercicio</a>
              <a href="#" class="filtro-categoria" data-categoria="Calistenia">Calistenia</a>
            </div>
          </div>
          <a href="carrito.html"> <i class="fas fa-shopping-cart"></i></a>
        </nav>
      </div>
      
      <div class="user-section">
        <div class="usuario-info">
          <div class="user-text">
            <div class="user-name" id="nombre-usuario">Cargando...</div>
            <div class="estado-usuario" id="estado-usuario">...</div>
          </div>
          <div class="user-icons">
            <div class="profile-dropdown">
              <i class="fas fa-user" id="profile-icon"></i>
              <div class="dropdown-content">
                <a href="carrito.html"><i class="fas fa-shopping-cart"></i> Mi Carrito</a>
                <a href="historial_user.html"><i class="fas fa-history"></i> Historial de Reservas</a>
                <a href="#"><i class="fas fa-headset"></i> Comunicar con Admin</a>
                <a href="#" id="cerrar-sesion"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </header>
  </div>
  
  <div class="tabla-container">
    <div class="tabla-header">
      <h2 class="titulo">MI CARRITO</h2>
    </div>
    <table class="tabla-articulos">
      <thead>
        <tr>
          <th>ID de Artículo</th>
          <th>Nombre de Artículo</th>
          <th>Categoría</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="tabla-carrito-body"></tbody>
    </table>
    <div class="tabla-footer">
      <button class="btn-reservar-tabla">Reservar articulos</button>
    </div>
  </div>
  <script src="script/topbar.js"></script>
  <script src="script/carrito.js"></script>
</body>
</html>
